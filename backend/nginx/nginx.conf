upstream backend {
    server hartbeat-backend:8005;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # ── Performance: zero-copy file transfer ──────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ── Gzip: compress text only — never compress video/binary ─
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 4;

    # Docker DNS resolver — re-resolve every 10s
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Media files (videos, PDFs, images) ────────────────────
    location /media/ {
        alias /app/media/;

        # Allow byte-range requests — essential for video seeking on mobile
        add_header Accept-Ranges bytes;

        # Cache for 30 days
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        # Security headers
        add_header X-Content-Type-Options nosniff;

        # Increase send timeout for large video files
        send_timeout 300s;

        # MIME types for common video/doc formats
        types {
            video/mp4                mp4;
            video/webm               webm;
            video/ogg                ogv;
            application/pdf          pdf;
            image/jpeg               jpg jpeg;
            image/png                png;
            image/webp               webp;
        }
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /socket.io/ {
        set $backend_upstream http://hartbeat-backend:8005;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Habit material uploads (video/PDF) — bypass nginx buffering ───
    # Without this block, nginx would spool the entire request body to disk
    # before forwarding to Django, effectively double-buffering large videos.
    # proxy_request_buffering off  → stream the upload directly to Django.
    # proxy_buffering off          → stream the response back directly too.
    # Applies to both user and admin upload endpoints.
    location ~ ^/api/(admin/)?habit-materials(/|$) {
        set $backend_upstream http://hartbeat-backend:8005;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Disable request/response buffering for large file uploads
        proxy_request_buffering off;
        proxy_buffering off;

        # Allow up to 500 MB per upload
        client_max_body_size 500M;

        # Long timeouts for slow upload connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        set $backend_upstream http://hartbeat-backend:8005;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Increase buffer sizes for large API responses
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
