upstream backend {
    server hartbeat-backend:8005;
}

upstream frontend {
    server hartbeat-frontend:3004;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Socket.IO — WebSocket + long-polling
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API, Admin, Django auth endpoints
    location ~ ^/(api|admin|auth)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static & Media files
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # API docs
    location /api/schema/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /api/docs/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js static export)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # SPA fallback — let frontend handle client-side routing
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 = /index.html;
    }
}
