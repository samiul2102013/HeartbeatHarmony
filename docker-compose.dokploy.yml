services:
  postgres:
    container_name: hartbeat-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=hartbeat_db
      - POSTGRES_USER=hartbeat
      - POSTGRES_PASSWORD=HartbeatDB@2026
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hartbeat -d hartbeat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: hartbeat-redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    container_name: hartbeat-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://hartbeat:HartbeatDB%402026@hartbeat-postgres:5432/hartbeat_db
      - REDIS_URL=redis://hartbeat-redis:6379/0
      - ALLOWED_HOSTS=*
      - CORS_ORIGINS=https://${FRONTEND_DOMAIN}
      - CSRF_TRUSTED_ORIGINS=https://${API_DOMAIN},https://${FRONTEND_DOMAIN}
      - FRONTEND_URL=https://${FRONTEND_DOMAIN}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - ALLOW_DEV_BYPASS=False
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certResolver=letsencrypt"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8005"
      - "traefik.http.routers.backend.middlewares=backend-ws"
      # WebSocket headers
      - "traefik.http.middlewares.backend-ws.headers.customRequestHeaders.X-Forwarded-Proto=https"
      # Health check endpoint
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/admin/login/"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.backend.loadbalancer.healthcheck.hostname=${API_DOMAIN}"

  frontend:
    container_name: hartbeat-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=https://${API_DOMAIN}
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certResolver=letsencrypt"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.services.frontend.loadbalancer.server.port=3004"
      # Health check
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=10s"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  dokploy-network:
    external: true
